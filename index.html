<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><title>TOEIC 7일 공부</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#182033;--muted:#6d7483;--line:#e3e6ec;--nav:#182033;--blue:#2f66a6;--blue-bg:#edf4ff;--red:#a04742;--red-bg:#fff2ef;--green:#397461;--green-bg:#eef8f4;--amber:#8a6528;--amber-bg:#fff8ea}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",Arial,sans-serif;line-height:1.55}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}.app{max-width:760px;margin:auto;padding:16px 14px 90px}h1{font-size:26px;line-height:1.2;margin:4px 0 4px}h2{font-size:21px;margin:0 0 12px}h3{font-size:17px;margin:0}.sub,.muted{color:var(--muted);font-size:13px}.top{padding:8px 2px 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;min-height:76px}button.stat{cursor:pointer;color:var(--ink)}button.stat:active{transform:scale(.98)}.stat b{display:block;font-size:21px;line-height:1.2}.stat span{display:block;font-size:12px;color:var(--muted);margin-top:5px}.stat.action{border-color:#ced9e8;background:#fbfdff}.stat.action b{color:var(--blue)}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:7px;overflow:auto;padding:9px 0 11px;background:linear-gradient(var(--bg) 86%,transparent);scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid var(--line);background:#fff;border-radius:22px;padding:9px 15px;white-space:nowrap;font-weight:800;color:#50596b}.tab.active{background:var(--nav);color:#fff;border-color:var(--nav)}.page{display:none}.page.active{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;margin:10px 0;box-shadow:0 1px 2px #00000008}.part-card{overflow:hidden}.part-head{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}.part-pill{flex:none;font-size:12px;font-weight:900;padding:5px 9px;border-radius:999px;background:var(--blue-bg);color:var(--blue)}.rc .part-pill{background:var(--red-bg);color:var(--red)}.part-title{font-size:19px;font-weight:900}.goal{background:#f7f8fa;padding:11px 12px;border-radius:12px;margin:10px 0;font-size:13px}.goal b{color:var(--blue)}.rc .goal b{color:var(--red)}
.section-title{font-size:14px;font-weight:900;color:var(--blue);background:var(--blue-bg);padding:7px 10px;border-radius:9px;margin:14px 0 7px}.rc .section-title{color:var(--red);background:var(--red-bg)}.tips{padding-left:20px;margin:8px 0}.tips li{margin:5px 0}.rows{display:grid}.row{display:grid;grid-template-columns:minmax(145px,1fr) 1fr;gap:10px;padding:7px 2px;border-bottom:1px solid #eef0f4;font-size:14px}.row:last-child{border-bottom:0}.row b{font-weight:800}.row span{color:#4e5768}.example{border-left:3px solid #c9d5e7;padding:8px 10px;margin:8px 0;background:#fafbfc;border-radius:0 10px 10px 0;font-size:13px}.example b{display:block;margin-bottom:3px}
.part-jumps{position:sticky;top:58px;z-index:15;display:flex;gap:7px;overflow:auto;padding:7px 0 9px;background:linear-gradient(var(--bg) 86%,transparent);scrollbar-width:none}.part-jumps::-webkit-scrollbar{display:none}.part-jump{flex:none;border:1px solid #dce2ea;background:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:900;color:#465064}.part-jump:active{transform:scale(.98)}.part-card{scroll-margin-top:118px}.strategy-hero{background:linear-gradient(135deg,#f7f9fc,#fff);border:1px solid var(--line);border-radius:18px;padding:17px;margin:10px 0}.strategy-step{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid #edf0f4}.strategy-step:last-child{border-bottom:0}.step-no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--nav);color:#fff;font-weight:900;font-size:12px}.strategy-table{display:grid;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:9px 0}.strategy-row{display:grid;grid-template-columns:78px 1fr;gap:10px;padding:9px 10px;border-bottom:1px solid var(--line);font-size:13px;background:#fff}.strategy-row:last-child{border-bottom:0}.strategy-row b{font-weight:900}.priority{display:inline-block;padding:2px 7px;border-radius:999px;background:var(--amber-bg);color:var(--amber);font-size:11px;font-weight:900;margin-left:5px}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.filter{padding:8px 11px;border-radius:11px;border:1px solid var(--line);background:#fff;font-weight:800;font-size:13px}.filter.active{background:var(--nav);color:#fff;border-color:var(--nav)}.note{padding:11px 12px;background:#f7f8fa;border-radius:11px;font-size:13px;margin:9px 0}.word{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px solid #edf0f4}.word input,.review-check input{width:20px;height:20px;accent-color:var(--blue)}.word small{display:block;color:var(--muted);font-size:13px}.word small.expr{color:var(--blue);margin-top:3px;font-size:12px}.chip{display:inline-block;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:900;background:#eef1f5}
.quiz-item{padding:16px 0;border-bottom:1px solid #e8ebf0}.quiz-item:last-child{border-bottom:0}.qtop{display:flex;align-items:center;justify-content:space-between;gap:8px}.review-check{display:flex;align-items:center;gap:5px;font-size:12px;color:#5e6676;white-space:nowrap}.q{font-size:16px;font-weight:800;margin:9px 0 11px}.context{white-space:pre-line;background:#f7f8fa;border-radius:11px;padding:11px 12px;font-size:13px;margin:8px 0}.listen{border:1px solid #d9e2ef;background:#fff;color:var(--blue);font-weight:800;border-radius:10px;padding:7px 10px;font-size:12px;margin:4px 0 7px}.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;padding:11px 12px;background:#fff;border:1px solid #dfe3e9;border-radius:11px;color:var(--ink)}.choice.correct{border-color:#4a876e;background:#edf8f3}.choice.wrong{border-color:#b45c55;background:#fff0ee}.result{margin-top:9px;font-size:13px;font-weight:900}.explain{margin-top:7px;padding:10px 12px;background:#f5f6f8;border-radius:10px;font-size:13px}.toolbar{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}.count{font-size:13px;color:var(--muted)}.footer{text-align:center;color:#8b92a0;font-size:12px;margin-top:28px}
@media(max-width:430px){.app{padding-left:11px;padding-right:11px}.stats{gap:6px}.stat{padding:10px 3px}.stat b{font-size:19px}.row{grid-template-columns:1fr;gap:2px}.row span{padding-bottom:4px}.part-head{gap:8px}}
</style></head>
<body><main class="app"><header class="top"><h1>TOEIC 7일 공부</h1><div class="sub">LC/RC 개념정리/빈출 표현, 단어장, 파트별 문제</div><div class="stats"><button class="stat action" data-action="open-review-words"><b id="reviewWordCount">0</b><span>다시 볼 단어</span></button><button class="stat action" data-action="open-review-questions"><b id="reviewQuestionCount">0</b><span>다시 볼 문제</span></button></div></header><nav class="tabs" id="tabs"></nav><section id="pages"></section><div class="footer">체크·오답 기록은 이 기기의 브라우저에 저장됩니다.</div></main>
<script>
const PARTS=[{"part": "P1", "title": "Part 1 사진 묘사", "desc": "사진 1장을 보고 가장 정확한 묘사 문장을 고르는 유형. 사람의 동작보다 사물의 상태·배치 표현에서 점수를 안정적으로 회수하기 좋다.", "goal": "사진에 실제로 보이는 대상만 확인 → 동작인지 상태인지 구분 → 위치/수동태 표현 확인", "tips": ["사람이 있으면 먼저 손·시선·몸 방향을 본다. reaching for, pointing at, leaning against 같은 동작이 자주 나온다.", "사물이 주어면 be + p.p. 상태 표현을 먼저 의심한다: are stacked, are arranged, is mounted.", "사진에 없는 사람/물건을 언급하거나 방향·위치를 바꿔 말하면 오답일 가능성이 높다.", "is being + p.p.는 ‘지금 그 동작이 진행 중’, is + p.p.는 ‘이미 그런 상태’라는 차이를 잡는다."], "sections": [{"title": "사람 동작 빈출", "rows": [["be seated", "앉아 있다"], ["be standing", "서 있다"], ["be strolling", "거닐다"], ["be approaching", "다가가다"], ["be crossing", "건너다"], ["be boarding", "탑승하다"], ["be reaching for", "~을 잡으려고 손을 뻗다"], ["be examining / inspecting", "살펴보다 / 점검하다"], ["be leaning against", "~에 기대다"], ["be bending over", "몸을 숙이다"], ["be pointing at", "~을 가리키다"], ["be handing A to B", "A를 B에게 건네다"], ["be pouring", "붓고 있다"], ["be arranging", "정리·배열하고 있다"], ["be loading / unloading", "싣다 / 내리다"], ["be sweeping", "쓸고 있다"], ["be trimming", "다듬고 있다"], ["be assembling", "조립하고 있다"]]}, {"title": "사물 상태·배치 빈출", "rows": [["be stacked / piled", "쌓여 있다"], ["be scattered", "흩어져 있다"], ["be arranged", "배열되어 있다"], ["be displayed", "진열되어 있다"], ["be lined up", "줄지어 있다"], ["be placed / positioned", "놓여·위치해 있다"], ["be mounted", "설치되어 있다"], ["be attached", "부착되어 있다"], ["be suspended / hanging", "매달려 있다"], ["be covered with", "~로 덮여 있다"], ["be surrounded by", "~에 둘러싸여 있다"], ["be filled with", "~로 가득 차 있다"], ["be occupied / unoccupied", "사용 중이다 / 비어 있다"], ["be propped open", "받쳐서 열린 상태다"]]}, {"title": "위치·사진 명사", "rows": [["in front of / behind", "~앞에 / 뒤에"], ["beside / next to", "~옆에"], ["across from", "~맞은편에"], ["along", "~을 따라"], ["against", "~에 맞대어"], ["underneath / above", "~아래에 / 위에"], ["in the foreground / background", "사진 앞쪽 / 뒤쪽에"], ["aisle", "통로"], ["railing", "난간"], ["cabinet", "수납장"], ["cart", "카트"], ["shelf", "선반"], ["counter", "카운터"], ["walkway", "보행로"], ["ladder", "사다리"]]}], "examples": [{"q": "A man is reaching for a folder on a shelf.", "a": "남자가 선반의 파일을 잡으려고 손을 뻗는 모습이면 정답 후보."}, {"q": "Several chairs are arranged around a table.", "a": "사람이 없어도 ‘의자가 탁자 주위에 배열되어 있다’라는 상태 묘사가 가능."}, {"q": "A car is being parked. vs. A car is parked.", "a": "주차하는 동작이 실제로 보이면 being parked, 이미 세워져 있으면 parked."}]}, {"part": "P2", "title": "Part 2 질의응답", "desc": "한 문장 질문/발화 뒤에 가장 자연스러운 응답을 고른다. 모든 단어를 듣기보다 첫 의문사와 질문 의도를 잡는 파트.", "goal": "첫 1~2단어로 답의 범위를 정하고, Yes/No가 없는 간접답변까지 정답으로 인정하기", "tips": ["Who/Where/When/Why/How/Which가 들리는 순간 답의 범위를 정한다.", "Yes/No 질문은 실제 답이 ‘아직 확인 중이에요’, ‘그에게 물어보세요’ 같은 간접답변인 경우가 많다.", "질문에 나온 단어를 그대로 반복하는 선택지는 오답 함정인 경우가 많다.", "Would you mind ~?는 수락할 때 Not at all / Of course not이 자연스럽다.", "부정의문문도 의미는 보통 일반 Yes/No 질문처럼 처리한다. Haven't you sent it yet? → I just did."], "sections": [{"title": "의문사별 답 범위", "rows": [["Who", "사람·담당자"], ["Where", "장소·위치"], ["When", "시간·날짜·기한"], ["Why", "이유·원인"], ["How often", "빈도"], ["How long", "기간"], ["How far", "거리"], ["How much", "가격·양"], ["How many", "개수"], ["Which", "선택"], ["Whose", "소유자"]]}, {"title": "간접답변 통째로 암기", "rows": [["I'm still working on it.", "아직 작업 중이에요."], ["You'd better ask him.", "그에게 물어보는 게 좋겠어요."], ["I have an appointment then.", "그때 약속이 있어요."], ["Let me check and get back to you.", "확인 후 다시 알려드릴게요."], ["That hasn't been announced yet.", "아직 발표되지 않았어요."], ["I haven't decided yet.", "아직 결정하지 않았어요."], ["Either one is fine.", "둘 중 어느 것이든 괜찮아요."], ["Not that I know of.", "제가 알기로는 아니에요."], ["I thought you had it.", "당신이 가지고 있는 줄 알았어요."], ["Why don't you ask Mina?", "미나에게 물어보는 게 어때요?"]]}, {"title": "제안·요청", "rows": [["Why don't we ~?", "~하는 게 어때요?"], ["How about ~ing?", "~하는 건 어때요?"], ["Would you like to ~?", "~하시겠어요?"], ["Could you ~?", "~해주시겠어요?"], ["Would you mind ~ing?", "~해주시겠어요?"], ["That would be great.", "그러면 좋겠어요."], ["I'd be happy to.", "기꺼이 할게요."], ["I'm afraid I can't.", "유감이지만 어렵습니다."]]}], "examples": [{"q": "Have you finished the report?", "a": "I'm still working on it. → Yes/No 없이도 ‘아직 안 끝남’을 전달하므로 정답."}, {"q": "Why was the meeting postponed?", "a": "The manager couldn't make it. → because가 없어도 이유 답변."}, {"q": "Would you mind closing the door?", "a": "Not at all. → ‘괜찮습니다’라는 의미로 요청 수락."}]}, {"part": "P3", "title": "Part 3 짧은 대화", "desc": "2~3명이 대화하고 세 문제를 푼다. 장소·목적·문제·다음 행동이 반복적으로 출제되며, 질문을 먼저 읽는 것이 핵심.", "goal": "음원 시작 전 질문/선택지 훑기 → 대화 초반에서 상황, 중간에서 문제, 끝에서 다음 행동 잡기", "tips": ["질문을 먼저 읽고 ‘누구/왜/무슨 문제/다음에 무엇’만 표시한다.", "첫 1~2문장: 장소·관계·목적. 중간: 문제/변경. 마지막: 해결책·다음 행동이 자주 나온다.", "표/그래프가 붙은 문제는 숫자·시간·상품명 하나를 대화에서 듣고 표와 교차한다.", "의도 문제는 말 그대로 번역하지 말고 기능을 본다: That's a good idea. = 동의, I'm afraid... = 거절·난색."], "sections": [{"title": "상황별 빈출", "rows": [["agenda / attendee", "회의 안건 / 참석자"], ["reschedule / postpone", "일정 변경 / 연기"], ["deadline / submit", "마감일 / 제출하다"], ["approve / revise", "승인하다 / 수정하다"], ["place an order", "주문하다"], ["in stock / out of stock", "재고 있음 / 품절"], ["shipment / delivery", "배송품 / 배송"], ["invoice / receipt", "송장 / 영수증"], ["refund / replacement", "환불 / 교체품"], ["make a reservation", "예약하다"], ["availability", "이용 가능 여부"], ["fully booked / vacancy", "예약 마감 / 빈자리·빈방"], ["maintenance / repair", "유지보수 / 수리"], ["malfunction", "오작동"], ["technician", "기술자"], ["renovation", "보수공사"]]}, {"title": "문제·다음 행동 신호", "rows": [["The problem is ...", "문제는 ~입니다."], ["Unfortunately, ...", "유감스럽게도 → 문제 등장"], ["It turns out that ...", "알고 보니 ~이다"], ["Why don't we ...?", "해결책 제안"], ["I'll take care of it.", "제가 처리할게요."], ["I'll send it over.", "제가 보내드릴게요."], ["Let me check.", "확인해 볼게요."], ["I'll call you back.", "다시 전화드릴게요."], ["We may need to ...", "~해야 할 수도 있다"]]}, {"title": "관계·직장 표현", "rows": [["be in charge of", "~을 담당하다"], ["be responsible for", "~을 담당하다"], ["be scheduled to", "~할 예정이다"], ["be supposed to", "~하기로 되어 있다"], ["be available", "시간이 되다 / 이용 가능하다"], ["be eligible for", "~할 자격이 있다"]]}], "examples": [{"q": "Our printer stopped working, so I called the service desk.", "a": "문제 = printer malfunction, 다음 행동 = technician/repair 관련 선택지 가능성이 높다."}, { const QUIZ=[{"id": "p1-1", "p": "P1", "q": "사진: 남자가 선반 쪽으로 손을 뻗고 있다. 가장 적절한 문장은?", "c": ["A man is reaching for an item on a shelf.", "A man is sweeping the floor.", "Some boxes are being unloaded.", "A shelf is being assembled."], "a": 0, "e": "reach for = ~을 잡으려고 손을 뻗다.", "context": null, "audio": null}, {"id": "p1-2", "p": "P1", "q": "사진: 회의실 탁자 주위로 의자들이 가지런히 놓여 있다. 가장 적절한 문장은?", "c": ["Some chairs are arranged around a table.", "Some chairs are being carried outside.", "A table is covered with papers.", "People are standing beside the chairs."], "a": 0, "e": "arranged around = ~주위에 배열되어 있다.", "context": null, "audio": null}, {"id": "p1-3", "p": "P1", "q": "사진: 벽에 그림 여러 점이 걸려 있다. 가장 적절한 문장은?", "c": ["Pictures are mounted on a wall.", "A wall is being painted.", "People are examining a map.", "Pictures are scattered on the floor."], "a": 0, "e": "be mounted on = ~에 설치·고정되어 있다.", "context": null, "audio": null}, {"id": "p1-4", "p": "P1", "q": "사진: 문이 받침대로 열린 채 고정되어 있다. 가장 적절한 문장은?", "c": ["The door is propped open.", "The door is being locked.", "A worker is approaching the door.", "The doorway is crowded."], "a": 0, "e": "be propped open = 받쳐서 열린 상태.", "context": null, "audio": null}, {"id": "p1-5", "p": "P1", "q": "사진: 상자들이 카트 위에 쌓여 있다. 가장 적절한 문장은?", "c": ["Boxes are stacked on a cart.", "A cart is being repaired.", "Boxes are scattered across a desk.", "A worker is pushing an empty cart."], "a": 0, "e": "be stacked = 쌓여 있다.", "context": null, "audio": null}, {"id": "p1-6", "p": "P1", "q": "사진: 여성이 기계 장비를 자세히 살펴보고 있다. 가장 적절한 문장은?", "c": ["A woman is inspecting a piece of equipment.", "A woman is handing over a document.", "Some equipment is being packed.", "A woman is sitting beside a machine."], "a": 0, "e": "inspect = 점검하다/자세히 살펴보다.", "context": null, "audio": null}, {"id": "p1-7", "p": "P1", "q": "사진: 여러 자동차가 건물 앞에 이미 주차되어 있다. 가장 적절한 문장은?", "c": ["Several cars are parked in front of a building.", "Several cars are being parked by attendants.", "A building is u const STORAGE_KEY='toeic_complete_review_v5';

if(!state.reviewWords)state.reviewWords={}; if(!state.reviewQuestions)state.reviewQuestions={}; if(!state.answers)state.answers={};
let wordFilter='all', quizFilter='all';

function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function updateStats(){
 const validWordIds=new Set(VOCAB.map(x=>x.id));
 const rw=Object.entries(state.reviewWords).filter(([id,v])=>v&&validWordIds.has(id)).length;
 const rq=Object.values(state.reviewQuestions).filter(Boolean).length;
 const rwEl=document.getElementById('reviewWordCount');

 if(rwEl)rwEl.textContent=rw;
 if(rqEl)rqEl.textContent=rq;
}

function partCard(p,mode){
 const sec=p.sections.map(s=>`<div class="section-title">${esc(s.title)}</div><div class="rows">${s.rows.map(r=>`<div class="row"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div>`).join('');
 const ex=p.examples.map(x=>`<div class="example"><b>${esc(x.q)}</b>${esc(x.a)}</div>`).join('');
 return `<article class="card part-card ${mode}" id="study-${p.part}"><div class="part-head"><span class="part-pill">${p.part}</span><div><div class="part-title">${esc(p.title.replace(p.part+' ',''))}</div><div class="muted">${esc(p.desc)}</div></div></div><div class="goal"><b>점수 포인트</b> · ${esc(p.goal)}</div><div class="section-title">문제 풀 때</div><ul class="tips">${p.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>${sec}<div class="section-title">예제로 확인</div>${ex}<button class="listen" data-action="go-part-quiz" data-part="${p.part}">${p.part} 문제 바로 풀기</button></article>`;
}
function renderStudy(mode){const want=mode==='lc'?['P1','P2','P3','P4']:['P5','P6','P7'];const jumps=`<div class="part-jumps">${want.map(p=>`<button class="part-jump" data-action="jump-part" data-part="${p}">Part ${p.slice(1)}</button>`).join('')}</div>`;return `<div class="${mode==='rc'?'rc':''}">${jumps}${PARTS.filter(p=>want.includes(p.part)).map(p=>partCard(p,mode)).join('')}</div>`;}
function renderStrategy(){
 return `<div>
 <div class="strategy-hero"><h2>이 웹 활용법 · TOEIC 공부전략</h2><div class="muted">개념을 오래 읽는 용도보다, <b>빈출 확인 → 문제 적용 → 다시 볼 것만 반복</b>하는 회독 도구로 쓰는 게 효율적입니다.</div></div>
 <div class="card"><div class="section-title">1. 이 웹은 이렇게 사용</div>
  <div class="strategy-step"><span class="step-no">1</span><div><b>LC/RC 파트별 핵심 먼저 보기</b><div class="muted">상단 Part 버튼으로 필요한 파트만 바로 이동. 처음부터 전부 외우려 하지 말고 유형·정답 신호·빈출 표현을 먼저 익힙니다.</div></div></div>
  <div class="strategy-step"><span class="step-no">2</span><div><b>단어장은 모르는 것만 체크</b><div class="muted">이미 아는 단어는 넘기고, 헷갈리는 단어만 ‘다시 볼 단어’로 표시합니다. 상단 숫자를 줄이는 방식으로 반복하세요.</div></div></div>
  <div class="strategy-step"><span class="step-no">3</span><div><b>파트별 문제를 바로 적용</b><div class="muted">개념을 본 직후 같은 Part 문제를 풀면 기억이 오래 갑니다. 맞았어도 찍었거나 헷갈렸다면 ‘다시 볼 문제’에 체크합니다.</div></div></div>
  <div class="strategy-step"><span class="step-no">4</span><div><b>마지막 회독은 체크한 것만</b><div class="muted">시험 전에는 전체를 다시 보지 말고 상단 ‘다시 볼 단어’와 ‘다시 볼 문제’만 반복합니다.</div></div></div>
 </div>
 <div class="card rc"><div class="section-title">2. 파트별 점수 우선 전략</div>
  <div class="strategy-table">
   <div class="strategy-row"><b>Part 1</b><div>동작/상태 표현과 위치 전치사를 먼저 잡기. 사진에 없는 대상·방향 바꾸기 함정을 제거.</div></div>
   <div class="strategy-row"><b>Part 2</b><div>첫 의문사 + 간접답변에 집중. 질문 단어를 그대로 반복하는 선택지에 끌리지 않기. <span class="priority">우선</span></div></div>
   <div class="strategy-row"><b>Part 3·4</b><div>음원 전에 질문과 선택지를 먼저 훑고 ‘누구/어디/문제/다음 행동’을 예상. 한 문제 놓쳐도 다음 문제로 바로 전환.</div></div>
   <div class="strategy-row"><b>Part 5</b><div>품사 → 수일치/태 → 접속사·전치사 → 어휘 순으로 빠르게 판별. 같은 어근 4개면 품사부터. <span class="priority">우선</span></div></div>
   <div class="strategy-row"><b>Part 6</b><div>문법은 Part 5처럼, 문장 삽입은 this/these/it/they 같은 지시어와 앞뒤 논리 확인.</div></div>
   <div class="strategy-row"><b>Part 7</b><div>문제의 고유명사·날짜·숫자·목적을 먼저 확인하고 근거 위치를 찾기. 답은 지문 표현과 다른 말로 바뀌어 나오는 경우가 많음.</div></div>
  </div>
 </div>
 <div class="card"><div class="section-title">3. 7일 회독 예시</div>
  <div class="strategy-table">
   <div class="strategy-row"><b>Day 1</b><div>Part 2 + Part 5 핵심 개념, 단어장 1회 체크</div></div>
   <div class="strategy-row"><b>Day 2</b><div>Part 1·3 + Part 5 문제, 다시 볼 단어 복습</div></div>
   <div class="strategy-row"><b>Day 3</b><div>Part 4 + Part 6, 문제풀이 후 헷갈린 문제 체크</div></div>
   <div class="strategy-row"><b>Day 4</b><div>Part 7 유형·패러프레이징 집중, 짧은 지문부터 정확도 확보</div></div>
   <div class="strategy-row"><b>Day 5</b><div>Part 1~7 섞어서 문제풀이, 취약 Part 다시 개념 회독</div></div>
   <div class="strategy-row"><b>Day 6</b><div>다시 볼 단어 + 다시 볼 문제 중심. 새 내용보다 오답 범위 줄이기</div></div>
   <div class="strategy-row"><b>Day 7</b><div>Part 2 간접답변, Part 5 문법표, Part 7 패러프레이징만 가볍게 최종 확인</div></div>
  </div>
 </div>
 <div class="card"><div class="section-title">4. 시험장에서</div><ul class="tips">
  <li><b>LC:</b> 한 문제를 못 들었어도 머물지 말고 바로 다음 문제. Part 3·4는 안내방송 중 다음 세트 질문을 미리 훑습니다.</li>
  <li><b>RC:</b> Part 5 한 문제에 오래 머물지 않습니다. 문법 문제는 빠르게 회수하고 남는 시간을 Part 7에 줍니다.</li>
  <li><b>Part 7:</b> 정답은 지문 문장을 그대로 복사하기보다 paraphrase로 바뀌는 경우가 많으므로 의미가 같은 표현을 찾습니다.</li>
  <li><b>체크 기준:</b> 틀린 문제뿐 아니라 ‘맞았지만 찍은 문제’도 다시 볼 문제에 넣습니다.</li>
 </ul></div>
 </div>`;
}
function renderWords(){
 let items=VOCAB;
 if(wordFilter==='review')items=items.filter(x=>state.reviewWords[x.id]); else if(wordFilter!=='all')items=items.filter(x=>x.p===wordFilter);
 const validIds=new Set(VOCAB.map(x=>x.id));
 const count=Object.entries(state.reviewWords).filter(([id,v])=>v&&validIds.has(id)).length;
 return `<div class="card"><h2>빈출 단어·표현</h2><div class="note"><b>260911 기존 단어장은 그대로 유지</b>하고 단어 82개를 추가해 총 <b>${VOCAB.length}개</b>로 보강했습니다. 오늘 보강한 300개 항목에는 실제 토익에서 같이 외우기 좋은 <b>빈출 표현</b>도 함께 표시됩니다. 모르는 단어는 체크하면 상단 <b>다시 볼 단어</b>에 저장됩니다.</div><div class="filters">${['all','review','P1','P2','P3','P4','P5','P6','P7'].map(f=>`<button class="filter ${f===wordFilter?'active':''}" data-action="word-filter" data-filter="${f}">${f==='all'?'전체':f==='review'?`다시 볼 단어 (${count})`:f}</button>`).join('')}</div><div class="count">현재 ${items.length}개 표시 · 전체 ${VOCAB.length}개</div>${items.length?items.map(x=>`<label class="word"><input type="checkbox" data-action="word-review" data-id="${esc(x.id)}" ${state.reviewWords[x.id]?'checked':''}><div><b>${esc(x.en)}</b><small>${esc(x.ko)}</small>${x.expr?`<small class="expr">빈출 · ${esc(x.expr)}</small>`:''}</div><span class="chip">${x.p}</span></label>`).join(''):'<div class="note">체크한 단어가 없습니다.</div>'}</div>`;
}
function quizItem(item,n){
 const selected=state.answers[item.id];
 const answered=Number.isInteger(selected);
 const context=item.context?`<div class="context">${esc(item.context)}</div>`:'';
 const listen=item.audio?`<button class="listen" data-action="speak" data-id="${item.id}">영어 듣기</button>`:'';
 const choices=item.c.map((c,i)=>{let cls='choice';if(answered&&i===item.a)cls+=' correct';if(answered&&i===selected&&selected!==item.a)cls+=' wrong';return `<button class="${cls}" data-action="answer" data-id="${item.id}" data-choice="${i}">${String.fromCharCode(65+i)}. ${esc(c)}</button>`;}).join('');
 let result=''; if(answered) result=`<div class="result">${selected===item.a?'정답':'오답 · 정답은 초록색 표시'}</div><div class="explain">${esc(item.e)}</div>`;
 return `<div class="quiz-item" id="q-${item.id}"><div class="qtop"><span class="chip">${item.p} · ${n+1}</span><label class="review-check"><input type="checkbox" data-action="question-review" data-id="${item.id}" ${state.reviewQuestions[item.id]?'checked':''}> 다시 볼 문제</label></div>${context}${listen}<div class="q">${esc(item.q)}</div><div class="choices">${choices}</div>${result}</div>`;
}
function renderQuiz(){
 let items=QUIZ;
 if(quizFilter==='review')items=items.filter(q=>state.reviewQuestions[q.id]); else if(quizFilter!=='all')items=items.filter(q=>q.p===quizFilter);
 const count=Object.values(state.reviewQuestions).filter(Boolean).length;
 return `<div class="card"><div class="toolbar"><div><h2>파트별 문제풀이</h2><div class="muted">한 화면에서 쭉 풀고, 선택 즉시 정답·해설 확인</div></div></div><div class="filters">${['all','review','P1','P2','P3','P4','P5','P6','P7'].map(f=>`<button class="filter ${f===quizFilter?'active':''}" data-action="quiz-filter" data-filter="${f}">${f==='all'?'전체':f==='review'?`다시 볼 문제 (${count})`:f}</button>`).join('')}</div><div class="note"><b>${items.length}문제</b> · 헷갈리거나 틀린 문제는 오른쪽 <b>다시 볼 문제</b> 체크 → 상단에서 체크한 문제만 바로 복습.</div>${items.length?items.map((q,i)=>quizItem(q,i)).join(''):'<div class="note">체크한 문제가 없습니다.</div>'}</div>`;
}
function renderPages(){document.getElementById('pages').innerHTML=`<section class="page active" id="lc">${renderStudy('lc')}</section><section class="page" id="rc">${renderStudy('rc')}</section><section class="page" id="words">${renderWords()}</section><section class="page" id="quiz">${renderQuiz()}</section><section class="page" id="strategy">${renderStrategy()}</section>`;}
function openPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.page===id));window.scrollTo({top:0,behavior:'smooth'});}
function rerenderWords(){document.getElementById('words').innerHTML=renderWords();}
function rerenderQuiz(){document.getElementById('quiz').innerHTML=renderQuiz();}
function speakQuestion(id){const item=QUIZ.find(q=>q.id===id);if(!item||!item.audio||!('speechSynthesis' in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(item.audio.replace(/^[MW]:/gm,''));u.lang='en-US';u.rate=.9;window.speechSynthesis.speak(u);}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]'); if(!el)return;
 const action=el.dataset.action;
 if(action==='tab')openPage(el.dataset.page);
 if(action==='jump-part'){const target=document.getElementById('study-'+el.dataset.part);if(target)target.scrollIntoView({behavior:'smooth',block:'start'});}
 if(action==='open-review-words'){wordFilter='review';rerenderWords();openPage('words');}
 if(action==='open-review-questions'){quizFilter='review';rerenderQuiz();openPage('quiz');}
 if(action==='word-filter'){wordFilter=el.dataset.filter;rerenderWords();}
 if(action==='quiz-filter'){quizFilter=el.dataset.filter;rerenderQuiz();}
 if(action==='go-part-quiz'){quizFilter=el.dataset.part;rerenderQuiz();openPage('quiz');}
 if(action==='answer'){state.answers[el.dataset.id]=Number(el.dataset.choice);save();rerenderQuiz();const target=document.getElementById('q-'+el.dataset.id);if(target)target.scrollIntoView({block:'center'});}
 if(action==='speak')speakQuestion(el.dataset.id);
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.action==='word-review'){state.reviewWords[el.dataset.id]=el.checked;save();if(wordFilter==='review')rerenderWords();}
 if(el.dataset.action==='question-review'){state.reviewQuestions[el.dataset.id]=el.checked;save();if(quizFilter==='review')rerenderQuiz();}
});
renderTabs();renderPages();updateStats();
</script></body></html>
