const NEW_RENDER_WORDS = "function renderWords(){\n let items=VOCAB;\n if(wordFilter==='review')items=items.filter(x=>state.reviewWords[x.id]);\n else if(wordFilter!=='all')items=items.filter(x=>x.p===wordFilter);\n\n const validIds=new Set(VOCAB.map(x=>x.id));\n const count=Object.entries(state.reviewWords).filter(([id,v])=>v&&validIds.has(id)).length;\n\n return `<div class=\"card\">\n   <h2>TOEIC 핵심 300</h2>\n   <div class=\"note\">\n     <b>단어 + 실제 빈출 표현</b>을 같이 보는 단어장입니다.\n     모르는 단어는 체크하면 상단 <b>다시 볼 단어</b>에 저장됩니다.\n   </div>\n   <div class=\"filters\">\n     ${['all','review','P1','P2','P3','P4','P5','P6','P7'].map(f=>`\n       <button class=\"filter ${f===wordFilter?'active':''}\" data-action=\"word-filter\" data-filter=\"${f}\">\n         ${f==='all'?'전체':f==='review'?`다시 볼 단어 (${count})`:f}\n       </button>`).join('')}\n   </div>\n   <div class=\"count\">현재 ${items.length}개 표시 · 전체 300개</div>\n   ${items.length\n     ? items.map(x=>`\n       <label class=\"word\">\n         <input type=\"checkbox\" data-action=\"word-review\" data-id=\"${esc(x.id)}\" ${state.reviewWords[x.id]?'checked':''}>\n         <div>\n           <b>${esc(x.en)}</b>\n           <small>${esc(x.ko)}</small>\n           ${x.expr?`<small class=\"expr\">빈출 · ${esc(x.expr)}</small>`:''}\n         </div>\n         <span class=\"chip\">${x.p}</span>\n       </label>`).join('')\n     : '<div class=\"note\">체크한 단어가 없습니다.</div>'}\n </div>`;\n}";

async function fetchBaseHtml() {
  const urls = [
    'https://raw.githubusercontent.com/pangisgood/toeic-7day-study/efa4dfc08dc6d82adf495c8d2265990623defdf7/index.html',
    'https://cdn.jsdelivr.net/gh/pangisgood/toeic-7day-study@efa4dfc08dc6d82adf495c8d2265990623defdf7/index.html'
  ];

  let lastError;
  for (const url of urls) {
    try {
      const res = await fetch(url, {cache:'no-store'});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.text();
    } catch (e) {
      lastError = e;
    }
  }
  throw lastError || new Error('기존 페이지를 불러오지 못했습니다.');
}

(async()=>{
  try {
    let html = await fetchBaseHtml();

    const vocabStart = html.indexOf('const VOCAB=[');
    const quizStart = html.indexOf('const QUIZ=[', vocabStart);
    if (vocabStart < 0 || quizStart < 0) throw new Error('VOCAB 영역을 찾지 못했습니다.');
    html = html.slice(0, vocabStart) + NEW_VOCAB_SOURCE + '\n' + html.slice(quizStart);

    html = html.replace(
      '.word small{display:block;color:var(--muted);font-size:13px}',
      '.word small{display:block;color:var(--muted);font-size:13px}.word small.expr{color:var(--blue);margin-top:3px;font-size:12px}'
    );

    if (!html.includes('.word small.expr')) {
      html = html.replace(
        '.chip{display:inline-block;',
        '.word small.expr{color:var(--blue);margin-top:3px;font-size:12px}.chip{display:inline-block;'
      );
    }

    const rwStart = html.indexOf('function renderWords(){');
    const quizItemStart = html.indexOf('function quizItem', rwStart);
    if (rwStart < 0 || quizItemStart < 0) throw new Error('renderWords 영역을 찾지 못했습니다.');
    html = html.slice(0, rwStart) + NEW_RENDER_WORDS + '\n' + html.slice(quizItemStart);

    html = html.replace(
      'const rw=Object.values(state.reviewWords).filter(Boolean).length;',
      'const validWordIds=new Set(VOCAB.map(x=>x.id)); const rw=Object.entries(state.reviewWords).filter(([id,v])=>v&&validWordIds.has(id)).length;'
    );

    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    console.error(err);
    document.getElementById('loading').innerHTML =
      '<div><b>페이지를 불러오지 못했습니다.</b><span>인터넷 연결을 확인한 뒤 새로고침해주세요.</span></div>';
  }
})();
