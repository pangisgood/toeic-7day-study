<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<title>TOEIC 7일 공부</title>

<style>
html,body{
  margin:0;
  min-height:100%;
  background:#f5f6f8;
  color:#182033;
  font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",Arial,sans-serif
}
.loading{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:24px;
  text-align:center
}
.loading b{
  display:block;
  font-size:21px;
  margin-bottom:7px
}
.loading span{
  font-size:13px;
  color:#6d7483
}
</style>
</head>

<body>

<div class="loading" id="loading">
  <div>
    <b>TOEIC 7일 공부</b>
    <span>학습 페이지를 불러오는 중입니다.</span>
  </div>
</div>

<script>

/*
  0911 기존 버전
  → LC/RC 상세 개념
  → 파트별 빈출 표현
  → 문제풀이
  → 오답/체크 기능
  전부 그대로 사용

  단어장만 현재 300단어 버전으로 교체
*/

const VOCAB_SOURCE_URLS = [
  'https://raw.githubusercontent.com/pangisgood/toeic-7day-study/03a08217dd0978ccec3cb683f0866f4f5b37adc8/index.html',
  'https://cdn.jsdelivr.net/gh/pangisgood/toeic-7day-study@03a08217dd0978ccec3cb683f0866f4f5b37adc8/index.html'
];


const NEW_RENDER_WORDS = `function renderWords(){

 let items=VOCAB;

 if(wordFilter==='review'){
   items=items.filter(x=>state.reviewWords[x.id]);
 }
 else if(wordFilter!=='all'){
   items=items.filter(x=>x.p===wordFilter);
 }

 const validIds=new Set(VOCAB.map(x=>x.id));

 const count=Object.entries(state.reviewWords)
   .filter(([id,v])=>v && validIds.has(id))
   .length;

 return \`
 <div class="card">

   <h2>TOEIC 핵심 300</h2>

   <div class="note">
     <b>단어 + 실제 빈출 표현</b>을 같이 보는 단어장입니다.
     모르는 단어는 체크하면 상단
     <b>다시 볼 단어</b>에 저장됩니다.
   </div>

   <div class="filters">

     \${[
       'all',
       'review',
       'P1',
       'P2',
       'P3',
       'P4',
       'P5',
       'P6',
       'P7'
     ].map(f=>\`

       <button
         class="filter \${f===wordFilter?'active':''}"
         data-action="word-filter"
         data-filter="\${f}"
       >

       \${
         f==='all'
         ? '전체'
         : f==='review'
         ? \`다시 볼 단어 (\${count})\`
         : f
       }

       </button>

     \`).join('')}

   </div>

   <div class="count">
     현재 \${items.length}개 표시 · 전체 300개
   </div>

   \${
     items.length

     ? items.map(x=>\`

       <label class="word">

         <input
           type="checkbox"
           data-action="word-review"
           data-id="\${esc(x.id)}"
           \${state.reviewWords[x.id]?'checked':''}
         >

         <div>

           <b>\${esc(x.en)}</b>

           <small>
             \${esc(x.ko)}
           </small>

           \${
             x.expr
             ? \`<small class="expr">
                  빈출 · \${esc(x.expr)}
                </small>\`
             : ''
           }

         </div>

         <span class="chip">
           \${x.p}
         </span>

       </label>

     \`).join('')

     : '<div class="note">체크한 단어가 없습니다.</div>'
   }

 </div>
 \`;

}`;



async function fetchText(urls){

 let lastError;

 for(const url of urls){

   try{

     const res=await fetch(
       url,
       {cache:'no-store'}
     );

     if(!res.ok){
       throw new Error(
         'HTTP '+res.status
       );
     }

     return await res.text();

   }
   catch(e){

     lastError=e;

   }

 }

 throw lastError ||
   new Error(
     '파일을 불러오지 못했습니다.'
   );

}



(async()=>{

 try{

   /*
     ① 0911 원본 HTML 불러오기
   */

   const [
     baseHtml,
     vocabHtml
   ] = await Promise.all([

     fetchText([
       './260911_index.html'
     ]),

     fetchText(
       VOCAB_SOURCE_URLS
     )

   ]);


   /*
     ② 현재 300단어 VOCAB 부분만 추출
   */

   const sourceVocabStart =
     vocabHtml.indexOf(
       'const VOCAB=['
     );

   const sourceQuizStart =
     vocabHtml.indexOf(
       'const QUIZ=[',
       sourceVocabStart
     );


   if(
     sourceVocabStart < 0 ||
     sourceQuizStart < 0
   ){

     throw new Error(
       '새 단어장 영역을 찾지 못했습니다.'
     );

   }


   const newVocabSource =
     vocabHtml.slice(
       sourceVocabStart,
       sourceQuizStart
     );


   /*
     ③ 0911 HTML에서 기존 VOCAB만 교체
   */

   let html = baseHtml;


   const vocabStart =
     html.indexOf(
       'const VOCAB=['
     );


   const quizStart =
     html.indexOf(
       'const QUIZ=[',
       vocabStart
     );


   if(
     vocabStart < 0 ||
     quizStart < 0
   ){

     throw new Error(
       '0911 단어장 영역을 찾지 못했습니다.'
     );

   }


   html =

     html.slice(
       0,
       vocabStart
     )

     +

     newVocabSource

     +

     html.slice(
       quizStart
     );


   /*
     ④ 단어 밑 빈출 표현 스타일 추가
   */

   html = html.replace(

     '.word small{display:block;color:var(--muted);font-size:13px}',

     '.word small{display:block;color:var(--muted);font-size:13px}.word small.expr{color:var(--blue);margin-top:3px;font-size:12px}'

   );


   if(
     !html.includes(
       '.word small.expr'
     )
   ){

     html = html.replace(

       '.chip{display:inline-block;',

       '.word small.expr{color:var(--blue);margin-top:3px;font-size:12px}.chip{display:inline-block;'

     );

   }


   /*
     ⑤ 기존 단어장 화면만
        300단어용 화면으로 교체
   */

   const rwStart =
     html.indexOf(
       'function renderWords(){'
     );


   const quizItemStart =
     html.indexOf(
       'function quizItem',
       rwStart
     );


   if(
     rwStart < 0 ||
     quizItemStart < 0
   ){

     throw new Error(
       '0911 단어 렌더링 영역을 찾지 못했습니다.'
     );

   }


   html =

     html.slice(
       0,
       rwStart
     )

     +

     NEW_RENDER_WORDS

     +

     '\\n'

     +

     html.slice(
       quizItemStart
     );


   /*
     ⑥ 예전 단어 체크 기록 중
        현재 300단어에 없는 항목 제외
   */

   html = html.replace(

     'const rw=Object.values(state.reviewWords).filter(Boolean).length;',

     'const validWordIds=new Set(VOCAB.map(x=>x.id)); const rw=Object.entries(state.reviewWords).filter(([id,v])=>v&&validWordIds.has(id)).length;'

   );


   /*
     ⑦ 완성된 0911 기반 페이지 출력
   */

   document.open();

   document.write(
     html
   );

   document.close();


 }
 catch(err){

   console.error(err);


   document
     .getElementById(
       'loading'
     )
     .innerHTML =

     '<div>' +

       '<b>페이지를 불러오지 못했습니다.</b>' +

       '<span>잠시 후 새로고침해주세요.</span>' +

     '</div>';

 }

})();

</script>

</body>
</html>
