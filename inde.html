P3", "q": "What problem are the speakers discussing?", "c": ["A broken copier", "A delayed shipment", "A missing invoice", "A canceled meeting"], "a": 0, "e": "out of order = 고장 난.", "context": "M: The copier on the third floor is out of order again.\\nW: I'll call the service company. They can send a technician this afternoon."}, {"id": "p3-2", "p": "P3", "q": "What will the woman probably do next?", "c": ["Contact a service company", "Order a new desk", "Move to another floor", "Print an invoice"], "a": 0, "e": "I'll call the service company → 다음 행동.", "context": "M: The copier on the third floor is out of order again.\\nW: I'll call the service company. They can send a technician this afternoon."}, {"id": "p3-3", "p": "P3", "q": "Why can't the woman take the 2 p.m. tour?", "c": ["It is fully booked.", "It has been canceled.", "It is too expensive.", "It starts too late."], "a": 0, "e": "fully booked = 예약이 꽉 찬.", "context": "W: I wanted to book the 2 p.m. museum tour, but it's fully booked.\\nM: The 3:30 tour still has several seats available."}, {"id": "p3-4", "p": "P3", "q": "What happened to the order?", "c": ["Its delivery was delayed.", "It was canceled.", "It was delivered to the wrong address.", "It was returned."], "a": 0, "e": "one-day delay = 배송 지연.", "context": "W: Your order was supposed to arrive today, but the carrier reported a one-day delay.\\nM: Please e-mail me the updated tracking information."}, {"id": "p4-1", "p": "P4", "q": "What is the purpose of the announcement?", "c": ["To announce a platform change", "To advertise a train pass", "To report a lost item", "To cancel all trains"], "a": 0, "e": "Platform 6 instead of Platform 4 = 승강장 변경.", "context": "Attention passengers. Because of track maintenance, trains to Westport will depart from Platform 6 instead of Platform 4 until 2 p.m."}, {"id": "p4-2", "p": "P4", "q": "Why has the change been made?", "c": ["Because of track maintenance", "Because of bad weather", "Because of a staff shortage", "Because of a special event"], "a": 0, "e": "Because of track maintenance가 직접 원인.", "context": "Attention passengers. Because of track maintenance, trains to Westport will depart from Platform 6 instead of Platform 4 until 2 p.m."}, {"id": "p4-3", "p": "P4", "q": "What must listeners do to receive a discount?", "c": ["Register by September 18", "Pay 120 dollars today", "Call the conference center", "Join a membership program"], "a": 0, "e": "no later than September 18 = 늦어도 9/18까지.", "context": "To receive the conference discount, register online no later than September 18. After that date, the standard fee will apply."}, {"id": "p5-1", "p": "P5", "q": "The new software is highly _____ and easy to use.", "c": ["effect", "effective", "effectively", "effectiveness"], "a": 1, "e": "be동사 뒤 보어 자리 → 형용사 effective."}, {"id": "p5-2", "p": "P5", "q": "The manager reviewed the proposal _____.", "c": ["care", "careful", "carefully", "carefulness"], "a": 2, "e": "reviewed를 꾸미므로 부사 carefully."}, {"id": "p5-3", "p": "P5", "q": "A number of employees _____ attending the seminar.", "c": ["is", "are", "was", "has"], "a": 1, "e": "a number of + 복수명사 → 복수동사."}, {"id": "p5-4", "p": "P5", "q": "The number of online orders _____ increased this month.", "c": ["have", "are", "has", "were"], "a": 2, "e": "the number of + 복수명사 → 단수 주어."}, {"id": "p5-5", "p": "P5", "q": "The report must be _____ by Friday.", "c": ["submit", "submitted", "submitting", "submission"], "a": 1, "e": "must be + p.p. 수동태."}, {"id": "p5-6", "p": "P5", "q": "_____ the heavy rain, the outdoor event continued.", "c": ["Although", "Despite", "Because", "While"], "a": 1, "e": "뒤가 명사 the heavy rain → Despite."}, {"id": "p5-7", "p": "P5", "q": "_____ the weather was bad, the flight departed on time.", "c": ["Despite", "Because of", "Although", "During"], "a": 2, "e": "뒤가 S+V → Although."}, {"id": "p5-8", "p": "P5", "q": "We look forward to _____ from you soon.", "c": ["hear", "hearing", "heard", "have heard"], "a": 1, "e": "look forward to의 to는 전치사 → -ing."}, {"id": "p5-9", "p": "P5", "q": "Employees should avoid _____ confidential files by e-mail.", "c": ["send", "to send", "sending", "sent"], "a": 2, "e": "avoid + -ing."}, {"id": "p5-10", "p": "P5", "q": "All staff members must comply _____ the new security policy.", "c": ["to", "with", "for", "on"], "a": 1, "e": "comply with = ~을 준수하다."}, {"id": "p5-11", "p": "P5", "q": "The final price depends _____ the quantity ordered.", "c": ["at", "for", "on", "to"], "a": 2, "e": "depend on."}, {"id": "p5-12", "p": "P5", "q": "Only members are eligible _____ the discount.", "c": ["to", "for", "with", "of"], "a": 1, "e": "be eligible for."}, {"id": "p5-13", "p": "P5", "q": "The schedule is subject _____ change without notice.", "c": ["for", "to", "with", "at"], "a": 1, "e": "be subject to = 변경될 수 있다."}, {"id": "p5-14", "p": "P5", "q": "The equipment will be delivered _____ three business days.", "c": ["among", "within", "throughout", "since"], "a": 1, "e": "within + 기간 = ~이내에."}, {"id": "p5-15", "p": "P5", "q": "The work was completed in accordance _____ the safety guidelines.", "c": ["to", "with", "for", "on"], "a": 1, "e": "in accordance with."}, {"id": "p6-1", "p": "P6", "q": "Sales declined in May. _____, they recovered in June.", "c": ["However", "Therefore", "For example", "Similarly"], "a": 0, "e": "declined ↔ recovered 대조 → However."}, {"id": "p6-2", "p": "P6", "q": "The road will be closed tomorrow. _____, employees should use the west entrance.", "c": ["Therefore", "However", "For instance", "Meanwhile"], "a": 0, "e": "원인 → 결과 관계이므로 Therefore."}, {"id": "p6-3", "p": "P6", "q": "We added online reservations. _____, customers can now change bookings themselves.", "c": ["As a result", "In contrast", "Nevertheless", "Otherwise"], "a": 0, "e": "결과를 나타내는 As a result."}, {"id": "p7-1", "p": "P7", "q": "Applicants must submit a résumé no later than September 20. What is the deadline?", "c": ["September 20", "September 21", "Before September", "No deadline"], "a": 0, "e": "no later than = 늦어도 ~까지."}, {"id": "p7-2", "p": "P7", "q": "The store will remain closed through Friday and reopen on Saturday. When will it reopen?", "c": ["Friday", "Saturday", "Sunday", "Monday"], "a": 1, "e": "through Friday = 금요일까지 닫힘 → 토요일 재개."}, {"id": "p7-3", "p": "P7", "q": "Your replacement item has already been shipped. What has happened?", "c": ["A replacement was sent.", "A refund was issued.", "The order was canceled.", "Payment failed."], "a": 0, "e": "replacement item = 교체품, shipped = 발송됨."}, {"id": "p7-4", "p": "P7", "q": "The workshop is complimentary for members. What does complimentary mean here?", "c": ["Free of charge", "Optional", "Expensive", "Limited"], "a": 0, "e": "complimentary = 무료의."}];

const STORAGE_KEY='toeic_complete_review_v5';
let state={reviewWords:{},reviewQuestions:{},answers:{}};
try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)state={...state,...JSON.parse(raw)};}catch(e){}
if(!state.reviewWords)state.reviewWords={}; if(!state.reviewQuestions)state.reviewQuestions={}; if(!state.answers)state.answers={};

const tabs=[['lc','LC'],['rc','RC'],['words','단어장'],['quiz','파트별 문제풀이'],['strategy','활용법·공부전략']];
let activeTab='lc',wordFilter='all',quizFilter='all';

function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){}updateStats();}
function validReviewWordCount(){const ids=new Set(VOCAB.map(x=>x.id));return Object.entries(state.reviewWords).filter(([id,v])=>v&&ids.has(id)).length;}
function updateStats(){
 document.getElementById('reviewWordCount').textContent=validReviewWordCount();
 document.getElementById('reviewQuestionCount').textContent=Object.values(state.reviewQuestions).filter(Boolean).length;
}

function renderTabs(){
 document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>`<button class="tab ${activeTab===id?'active':''}" data-action="tab" data-tab="${id}">${label}</button>`).join('');
}

function partCard(x){
 return `<div class="card ${x.group==='RC'?'rc':''}">
 <div class="part-head"><span class="part-pill">${x.part}</span><div><div class="part-title">${esc(x.title)}</div><div class="muted">${esc(x.desc)}</div></div></div>
 <div class="goal"><b>목표</b> · ${esc(x.goal)}</div>
 <div class="section-title">핵심 포인트</div><ul class="tips">${x.tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
 <div class="section-title">빈출 표현</div><div class="rows">${x.rows.map(r=>`<div class="row"><b>${esc(r[0])}</b><span>${esc(r[1])}</span></div>`).join('')}</div>
 </div>`;
}

function renderStudy(group){
 return PARTS.filter(x=>x.group===group).map(partCard).join('');
}

function renderWords(){
 let items=VOCAB;
 if(wordFilter==='review')items=items.filter(x=>state.reviewWords[x.id]);
 else if(wordFilter!=='all')items=items.filter(x=>x.p===wordFilter);
 const count=validReviewWordCount();
 return `<div class="card"><h2>TOEIC 핵심 300</h2>
 <div class="note"><b>단어 + 실제 빈출 표현</b>을 같이 보는 단어장입니다. 모르는 단어는 체크하면 상단 <b>다시 볼 단어</b>에 저장됩니다.</div>
 <div class="filters">${['all','review','P1','P2','P3','P4','P5','P6','P7'].map(f=>`<button class="filter ${f===wordFilter?'active':''}" data-action="word-filter" data-filter="${f}">${f==='all'?'전체':f==='review'?`다시 볼 단어 (${count})`:f}</button>`).join('')}</div>
 <div class="count">현재 ${items.length}개 표시 · 전체 300개</div>
 ${items.length?items.map(x=>`<label class="word"><input type="checkbox" data-action="word-review" data-id="${esc(x.id)}" ${state.reviewWords[x.id]?'checked':''}><div><b>${esc(x.en)}</b><small>${esc(x.ko)}</small><small class="expr">빈출 · ${esc(x.expr||x.en)}</small></div><span class="chip">${x.p}</span></label>`).join(''):'<div class="note">체크한 단어가 없습니다.</div>'}
 </div>`;
}

function quizItem(x){
 const selected=state.answers[x.id];
 const answered=selected!==undefined;
 return `<div class="quiz-item">
 <div class="qtop"><span class="chip">${x.p}</span><label class="review-check"><input type="checkbox" data-action="quiz-review" data-id="${x.id}" ${state.reviewQuestions[x.id]?'checked':''}>다시 볼 문제</label></div>
 ${x.context?`<div class="context">${esc(x.context)}</div>`:''}
 <div class="q">${esc(x.q)}</div>
 <div class="choices">${x.c.map((c,i)=>`<button class="choice ${answered?(i===x.a?'correct':i===selected?'wrong':''):''}" data-action="answer" data-id="${x.id}" data-index="${i}">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('')}</div>
 ${answered?`<div class="result">${selected===x.a?'정답':'오답'}</div><div class="explain">${esc(x.e)}</div>`:''}
 </div>`;
}

function renderQuiz(){
 let items=QUIZ;
 if(quizFilter==='review')items=items.filter(x=>state.reviewQuestions[x.id]);
 else if(quizFilter!=='all')items=items.filter(x=>x.p===quizFilter);
 const count=Object.values(state.reviewQuestions).filter(Boolean).length;
 return `<div class="card"><h2>파트별 문제풀이</h2>
 <div class="note">문제를 풀고 바로 정답·해설을 확인하세요. 다시 볼 문제에 체크하면 상단 카운트에 저장됩니다.</div>
 <div class="filters">${['all','review','P1','P2','P3','P4','P5','P6','P7'].map(f=>`<button class="filter ${f===quizFilter?'active':''}" data-action="quiz-filter" data-filter="${f}">${f==='all'?'전체':f==='review'?`다시 볼 문제 (${count})`:f}</button>`).join('')}</div>
 <div class="count">현재 ${items.length}문제 표시</div>
 ${items.length?items.map(quizItem).join(''):'<div class="note">체크한 문제가 없습니다.</div>'}
 </div>`;
}

function renderStrategy(){
 const steps=[
 ['1','LC는 첫 의문사·상황을 놓치지 않는 연습부터. 틀린 문제는 소리와 정답 근거를 같이 복습.'],
 ['2','Part 5는 10~20초 판단. 품사·수일치·전치사/접속사부터 자동화.'],
 ['3','Part 6는 빈칸 앞뒤 한 문장까지 읽어 연결어·지시어를 확인.'],
 ['4','Part 7은 문제 먼저 읽고 날짜·이름·가격·요청사항을 근거로 검색.'],
 ['5','단어장은 뜻만 외우지 말고 아래 빈출 표현까지 한 덩어리로 암기.'],
 ['6','시험에서는 Part 5 약 10분, Part 6 약 8분, Part 7에 50분 이상 확보.']
 ];
 return `<div class="card"><h2>활용법 · 공부전략</h2><div class="note">짧게 여러 번 반복하는 용도로 만든 개인용 TOEIC 대시보드입니다.</div>${steps.map(s=>`<div class="strategy-step"><div class="step-no">${s[0]}</div><div>${esc(s[1])}</div></div>`).join('')}</div>`;
}

function render(){
 renderTabs();
 let html='';
 if(activeTab==='lc')html=renderStudy('LC');
 if(activeTab==='rc')html=renderStudy('RC');
 if(activeTab==='words')html=renderWords();
 if(activeTab==='quiz')html=renderQuiz();
 if(activeTab==='strategy')html=renderStrategy();
 document.getElementById('pages').innerHTML=`<div class="page active">${html}</div>`;
 updateStats();
 window.scrollTo({top:0,behavior:'smooth'});
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');
 if(!el)return;
 const action=el.dataset.action;
 if(action==='tab'){activeTab=el.dataset.tab;render();}
 if(action==='open-review-words'){activeTab='words';wordFilter='review';render();}
 if(action==='open-review-questions'){activeTab='quiz';quizFilter='review';render();}
 if(action==='word-filter'){wordFilter=el.dataset.filter;render();}
 if(action==='quiz-filter'){quizFilter=el.dataset.filter;render();}
 if(action==='answer'){state.answers[el.dataset.id]=Number(el.dataset.index);save();render();}
});

document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.action==='word-review'){state.reviewWords[el.dataset.id]=el.checked;save();}
 if(el.dataset.action==='quiz-review'){state.reviewQuestions[el.dataset.id]=el.checked;save();}
});

render();
</script>
</body>
